---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zorin-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vishnuvardhan1170/zorin-gitops.git
    targetRevision: main
    path: helm
    helm:
      releaseName: zorin
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: zorin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
