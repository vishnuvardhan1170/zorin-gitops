namespace: zorin-dev

replicaCount: 1

image:
  tag: "latest"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

rollouts:
  enabled: false

mongoDeployment:
  persistence:
    size: 5Gi

mongoExpress:
  enabled: true

ingress:
  hosts:
    - host: zorin-dev.example.com
      paths:
        - path: /
          pathType: Prefix
  mongoExpressHost: zorin-dev-mongo.example.com   