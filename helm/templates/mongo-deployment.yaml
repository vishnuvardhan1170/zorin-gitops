{{- if .Values.mongoDeployment.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zorin.fullname" . }}-mongo
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zorin.labels" . | nindent 4 }}
    app: zorin-mongo
spec:
  serviceName: {{ include "zorin.fullname" . }}-mongo
  replicas: 1
  selector:
    matchLabels:
      app: zorin-mongo
  template:
    metadata:
      labels:
        {{- include "zorin.selectorLabels" . | nindent 8 }}
        app: zorin-mongo
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongoDeployment.image.repository }}:{{ .Values.mongoDeployment.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          {{- if .Values.mongoDeployment.auth.enabled }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "zorin.fullname" . }}-mongo-credentials
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zorin.fullname" . }}-mongo-credentials
                  key: password
          {{- end }}
          resources:
            {{- toYaml .Values.mongoDeployment.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: mongo-storage
      spec:
        accessModes:
          {{- toYaml .Values.mongoDeployment.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.mongoDeployment.persistence.size }}
        {{- if .Values.mongoDeployment.persistence.storageClassName }}
        storageClassName: {{ .Values.mongoDeployment.persistence.storageClassName }}
        {{- end }}
{{- end }}