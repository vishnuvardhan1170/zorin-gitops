{{- if .Values.mongoDeployment.auth.enabled }}
{{- if not .Values.mongoDeployment.auth.username }}
{{- fail "mongoDeployment.auth.username is required when auth is enabled" }}
{{- end }}
{{- if not .Values.mongoDeployment.auth.password }}
{{- fail "mongoDeployment.auth.password is required when auth is enabled" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zorin.fullname" . }}-mongo-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zorin.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.mongoDeployment.auth.username | b64enc | quote }}
  password: {{ .Values.mongoDeployment.auth.password | b64enc | quote }}
{{- end }}