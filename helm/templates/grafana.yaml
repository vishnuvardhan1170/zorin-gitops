{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zorin.fullname" . }}-grafana-creds
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "change-me-in-prod"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zorin.fullname" . }}-grafana-ds
  namespace: {{ .Values.namespace }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://{{ include "zorin.fullname" . }}-prometheus.{{ .Values.namespace }}.svc:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zorin.fullname" . }}-grafana
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ include "zorin.fullname" . }}-grafana-creds
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: ds
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: storage
          emptyDir: {}
        - name: ds
          configMap:
            name: {{ include "zorin.fullname" . }}-grafana-ds
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zorin.fullname" . }}-grafana
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
{{- end }}