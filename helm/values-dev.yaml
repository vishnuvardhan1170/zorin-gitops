namespace: zorin-dev

replicaCount: 1

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  MONGO_URI: "mongodb://<your-dev-mongo-host>:27017/zorin"

rollouts:
  enabled: false

mongoDeployment:
  enabled: false

ingress:
  enabled: false

# docker run -d --name zorin-dev-mongo -p 27017:27017 mongo:8.2   
# MONGO_URI: "mongodb://host.docker.internal:27017/zorin"