---
namespace: zorin

replicaCount: 2

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

rollouts:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 30
        - pause: { duration: 5m }
        - setWeight: 60
        - pause: { duration: 5m }
        - setWeight: 100
  analysis:
    enabled: false

config:
  MONGO_URI: "mongodb://zorin-mongo:27017/zorin"

mongoDeployment:
  auth:
    enabled: false
  persistence:
    size: 20Gi

mongoExpress:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: zorin.example.com
      paths:
        - path: /
          pathType: Prefix


# run this before first sync on eks clusteer
# kubectl create namespace argo-rollouts
# kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
# kubectl wait --for=condition=Established crd/rollouts.argoproj.io --timeout=90s
# kubectl -n argo-rollouts rollout status deployment/argo-rollouts
