namespace: zorin

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

rollouts:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 30
        - pause: { duration: 5m }
        - setWeight: 60
        - pause: { duration: 5m }
        - setWeight: 100
  analysis:
    enabled: false
    interval: 1m
    successCondition: "result[0] >= 0.95"
    failureLimit: 3

mongoDeployment:
  persistence:
    size: 20Gi

ingress:
  hosts:
    - host: zorin.example.com
      paths:
        - path: /
          pathType: Prefix