---
namespace: zorin

replicaCount: 1

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

rollouts:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 30
        - pause: { duration: 5m }
        - setWeight: 60
        - pause: { duration: 5m }
        - setWeight: 100
  analysis:
    enabled: false

config:
  MONGO_URI: "mongodb://zorin-mongo:27017/zorin"

mongoDeployment:
  auth:
    enabled: false
  persistence:
    size: 5Gi

mongoExpress:
  enabled: false   