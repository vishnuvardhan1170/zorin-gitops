---
replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/zorin-app/zorin-app
  tag: "latest"
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

config:
  MONGO_URI: "mongodb://zorin-mongo:27017/zorin"
  MONGO_DB: "zorin"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

rollouts:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 30
        - pause: { duration: 5m }
        - setWeight: 60
        - pause: { duration: 5m }
        - setWeight: 100
  analysis:
    enabled: false

mongoDeployment:
  enabled: true
  image:
    repository: mongo
    tag: "8.2"
  auth:
    enabled: false
  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mongoExpress:
  enabled: false

serviceAccount:
  create: true
  name: zorin-sa

namespace: zorin

monitoring:
  enabled: false   